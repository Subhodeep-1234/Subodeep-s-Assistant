<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alcove Realty</title>
  <link rel="stylesheet" href="/styles.css?v=1" />
  <!-- Shared by both public interview form links (Candidate, Interviewer).
  Same idea as workforce-shell.html: on a real desktop this iframes the
  real form back in at a fixed phone width so interview-forms.css's own
  narrow-screen @media rules (which only ever fired on an actual phone
  before) apply for real, instead of the real form sitting in its
  max-width column at whatever the real (wide) window width is - that
  mismatch was the "popup" look and the field-layout differences the
  form showed on desktop vs a real phone. A real phone (viewport <=
  430px) gets the iframe at exactly 100% width/height, unchanged from
  before. The token stays in the URL path, so this shell just re-adds
  ?embedded=1 to whatever path it was loaded at. -->
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(560px 320px at 50% -80px, var(--accent-bg), transparent),
        var(--paper);
    }
    #ivFrame {
      width: min(430px, 100vw);
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: var(--paper);
    }
    @media (min-width: 431px) {
      body { align-items: center; padding: 28px 0; box-sizing: border-box; }
      #ivFrame {
        height: min(920px, calc(100vh - 56px));
        height: min(920px, calc(100dvh - 56px));
        border-radius: 30px;
        box-shadow: 0 26px 60px rgba(15, 23, 42, 0.24), 0 0 0 1px rgba(15, 23, 42, 0.06);
      }
    }
  </style>
</head>
<body>
  <iframe id="ivFrame" title="Alcove Realty" allow="clipboard-write"></iframe>
  <script>
    document.getElementById('ivFrame').src = window.location.pathname + '?embedded=1';
  </script>
</body>
</html>
